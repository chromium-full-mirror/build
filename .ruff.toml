# Formatting settings match the previous .style.yapf (based_on_style = yapf)
# to minimise churn.
line-length = 80
indent-width = 2

extend-exclude = [
    "siso/third_party",
]

[format]
quote-style = "preserve"

[lint]
select = [
    # Default rule sets
    "E",
    "F",
    "W",

    # Additional individually-enabled rules
    "A001",  # Variable shadows a builtin
    "B007",  # Loop variable unused in the loop body
]
ignore = [
    "E501",  # Line length is handled by formatter
]
